version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: wordle-db
    environment:
      POSTGRES_USER: wordle_user
      POSTGRES_PASSWORD: wordle_password
      POSTGRES_DB: wordle_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: