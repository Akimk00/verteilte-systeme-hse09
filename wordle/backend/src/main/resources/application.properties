spring.application.name=wordle
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/wordle_db
spring.datasource.username=wordle_user
spring.datasource.password=wordle_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Critical for Spring Boot 3.x / 4.x to explicitly map types
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect