apiVersion: v1
kind: Namespace
metadata:
  name: wordle
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: wordle-config
  namespace: wordle
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://wordle-db-service:5432/wordle"
  SPRING_DATASOURCE_USERNAME: "wordle"
---

apiVersion: v1
kind: Secret
metadata:
  name: wordle-secret
  namespace: wordle
type: Opaque
data:
  # Base64 encoded string of "wordle"
  postgres-password: d29yZGxl
---

# 1. POSTGRESQL DATABASE STORAGE & WORKLOAD
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: wordle
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordle-db
  namespace: wordle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordle-db
  template:
    metadata:
      labels:
        app: wordle-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: "wordle"
            - name: POSTGRES_USER
              value: "wordle"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordle-secret
                  key: postgres-password
          ports:
            - containerPort: 5432
          livenessProbe:
            exec:
              command: [ "pg_isready", "-U", "wordle", "-d", "wordle" ]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
              exec:
                command: [ "pg_isready", "-U", "wordle", "-d", "wordle" ]
              initialDelaySeconds: 5
              periodSeconds: 5
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---

apiVersion: v1
kind: Service
metadata:
  name: wordle-db-service
  namespace: wordle
spec:
  ports:
    - port: 5432
  selector:
    app: wordle-db
---

# 2. SPRING BOOT BACKEND WORKLOAD
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordle-backend
  namespace: wordle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordle-backend
  template:
    metadata:
      labels:
        app: wordle-backend
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z wordle-db-service 5432; do echo waiting for database; sleep 1; done;' ]
      containers:
        - name: backend
          image: wordle-backend:1.0
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: wordle-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: wordle-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordle-secret
                  key: postgres-password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/word
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wordle
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: wordle-backend
---

# 3. ANGULAR / REACT FRONTEND WORKLOAD
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordle-frontend
  namespace: wordle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordle-frontend
  template:
    metadata:
      labels:
        app: wordle-frontend
    spec:
      containers:
        - name: frontend
          image: wordle-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---

apiVersion: v1
kind: Service
metadata:
  name: wordle-frontend-service
  namespace: wordle
spec:
  type: NodePort
  ports:
    - port: 4200
      targetPort: 80
      nodePort: 30080
  selector:
    app: wordle-frontend