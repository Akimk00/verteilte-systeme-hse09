<div class="start-screen">
  <div class="hero">
    <div class="wordmark" aria-label="Wordle">
      <span class="wm-tile s-correct">W</span>
      <span class="wm-tile s-present">O</span>
      <span class="wm-tile s-absent">R</span>
      <span class="wm-tile s-correct">D</span>
      <span class="wm-tile s-present">L</span>
      <span class="wm-tile s-absent">E</span>
    </div>
    <p class="tagline">Six guesses. One hidden word. A hint when you need it.</p>
    <button class="start-btn" (click)="startGame()">Start game</button>
  </div>
</div>
