spring.application.name=wordle

# datasource, overridable via environment (Docker/Kubernetes set these)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wordle}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wordle}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wordle}

# schema managed by schema.sql, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# run schema.sql then data.sql on startup
spring.sql.init.mode=always

server.port=8080

# Kubernetes
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.probes.enabled=true
